<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070b07">
  <meta name="description" content="Рабочий кабинет Freedom: личные разговоры, оценки, рейтинг и апелляции.">
  <title>Сотрудники — Freedom Bank</title>
  <link rel="preload" href="assets/montserrat-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="segmented-navbar.css"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="secondary.css"><link rel="stylesheet" href="team.css"><link rel="stylesheet" href="workforce.css"><link rel="stylesheet" href="buttons.css"><script src="wave-background.js" defer></script><script src="segmented-navbar.js" defer></script><script src="auth-config.js" defer></script><script src="auth.js" defer></script><script src="app.js" defer></script><script src="qa-config.js" defer></script><script src="employees.js" defer></script>
</head>
<body class="employees-page secondary-page">
<div class="site-background wave-background" aria-hidden="true"></div>
<main class="freedom" id="freedom-app">
  <header class="header">
    <a class="brand" href="/" aria-label="Freedom Bank — главная"><span class="brand-crop"><img src="assets/freedom-logo.png" alt="Freedom Bank" width="1536" height="1024"></span></a>
    <nav class="navigation segmented-nav" aria-label="Основная навигация">
      <div class="segmented-control" role="radiogroup" aria-label="Раздел сайта" aria-orientation="horizontal">
        <button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-panel="card" data-page-route="/">Карта Freedom</button>
        <button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-panel="check" data-page-route="check.html">Проверка</button>
        <button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-panel="app">Приложение</button>
        <button class="segment" type="button" role="radio" aria-checked="true" tabindex="0" data-panel="employees" data-page-route="employees.html">Сотрудники</button>
      </div>
    </nav>
    <div class="header-actions"><button class="language" aria-label="Выбрать язык" data-panel="language">RU</button><button class="button login-button" data-auth="login">Войти</button><button class="button header-cta" data-auth="signup">Регистрация</button><button class="menu-button" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span></button></div>
  </header>

  <section id="employees-root" class="team-content" aria-label="Сотрудники"><noscript><h1>Наша команда</h1><p>Для просмотра интерактивных бейджей нужен JavaScript.</p></noscript></section>
  <footer class="footer"><span>Freedom Bank · Дизайн-концепт</span><span>Твоя свобода начинается здесь.</span><button data-panel="support">На связи</button></footer>
  <div class="mobile-menu" hidden><div class="segmented-control segmented-vertical" role="radiogroup" aria-label="Раздел сайта" aria-orientation="vertical"><button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-panel="card" data-page-route="/">Карта Freedom</button><button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-panel="check" data-page-route="check.html">Проверка</button><button class="segment" type="button" role="radio" aria-checked="false" tabindex="-1" data-panel="app">Приложение</button><button class="segment" type="button" role="radio" aria-checked="true" tabindex="0" data-panel="employees" data-page-route="employees.html">Сотрудники</button></div><button class="button login-button" data-auth="login">Войти</button><button class="button button-primary" data-auth="signup">Регистрация</button></div>
  <dialog class="panel"><button class="panel-close" aria-label="Закрыть окно">×</button><div id="panel-content"></div></dialog>
  <dialog class="auth-dialog" aria-labelledby="auth-title"><button class="auth-close" type="button" aria-label="Закрыть авторизацию">×</button><div class="auth-intro">ТВОЯ СВОБОДА НАЧИНАЕТСЯ ЗДЕСЬ</div><h2 id="auth-title">С возвращением.</h2><div class="auth-tabs" role="group" aria-label="Вход или регистрация"><button type="button" data-auth-mode="login" aria-pressed="true">Вход</button><button type="button" data-auth-mode="signup" aria-pressed="false">Регистрация</button></div><form id="auth-form"><label for="auth-email">Электронная почта</label><input id="auth-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"><label for="auth-password">Пароль</label><div class="password-field"><input id="auth-password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="button" class="password-toggle" aria-label="Показать пароль">Показать</button></div><p class="password-hint" hidden>Не менее 8 символов.</p><div class="signup-confirm" hidden><label for="auth-confirm">Повторите пароль</label><input id="auth-confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128"></div><p class="auth-message" role="status" aria-live="polite"></p><button class="button button-primary auth-submit" type="submit">Войти</button></form><section class="account-view" hidden><p class="account-caption">Вы вошли в аккаунт</p><p class="account-email"></p><p>Ваш профиль сохранён. Вы можете продолжить знакомство с картой.</p><button type="button" class="button button-primary account-continue">Продолжить</button><button type="button" class="button account-logout">Выйти</button><p class="account-message" role="status"></p></section><p class="auth-note">Аккаунт дизайн-концепта. Не интернет-банк.</p></dialog>
</main>
</body>
</html>
